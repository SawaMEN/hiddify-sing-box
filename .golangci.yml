version: "2"
run:
  go: "1.26"
  build-tags:
    - with_quic
    - with_dhcp
    - with_wireguard
    - with_utls
    - with_acme
    - with_clash_api
    - with_tailscale
    - with_ccm
    - with_ocm
    - badlinkname
    - tfogo_checklinkname0
linters:
  default: none
  enable:
    - ineffassign
    - staticcheck
    - unused
    - modernize
  settings:
    modernize:
      disable:
        - omitzero # nested struct omitempty -> omitzero changes JSON output semantics
    staticcheck:
      checks:
        - all
        - -QF1008 # could remove embedded field "<interface>" from selector
        - -ST1003 # should not use ALL_CAPS in Go names; use CamelCase instead
        - -QF1001 # could apply De Morgan's law
        - -SA4023 # impossible nil comparison, false positive on platform-specific implementations
  exclusions:
    generated: lax
    rules:
      # These APIs define existing wire/cache formats or low-level HTTP/2
      # CONNECT streams. Replacing them changes compatibility, not correctness.
      - linters: [staticcheck]
        text: 'SA1019: .*github.com/sagernet/sing/common/varbin\.'
      - linters: [staticcheck]
        text: 'SA1019: .*golang.org/x/net/http2'
      # Explicit legacy configuration support and its regression tests.
      - linters: [staticcheck]
        text: 'SA1019: .*MultiDNSServerOptions|SA1019: .*RuleSetIPCIDRAcceptEmpty|SA1019: .*InboundDetour|SA1019: .*RemoteServerListUrl'
      # Keep the existing retry behaviour for older net.Error implementations.
      - linters: [staticcheck]
        text: 'SA1019: .*net.Error.*Temporary'
      # Xray exposes these byte-slice pools as a stable API.
      - linters: [staticcheck]
        path: 'common/xray/(buf/buffer|bytespool/pool)\.go|protocol/vless/encryption/common\.go'
        text: 'SA6002:'
    presets:
      - comments
      - common-false-positives
    paths:
      - transport/simple-obfs
      - \.pb\.go$
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/sagernet/)
        - default
      custom-order: true
