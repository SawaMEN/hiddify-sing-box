name: Upstream sync workspace
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/sync-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch upstream and package Git history
        run: |
          git remote add upstream https://github.com/hiddify/hiddify-sing-box.git
          git fetch upstream v5
          git bundle create /tmp/sync-workspace.bundle refs/remotes/origin/main refs/remotes/upstream/v5
          git log --oneline 004371d6be2395ee4379054a8cf113f339dbe231..upstream/v5
          git diff --stat 004371d6be2395ee4379054a8cf113f339dbe231 upstream/v5
      - uses: actions/upload-artifact@v7
        with:
          name: sync-workspace
          path: /tmp/sync-workspace.bundle
          retention-days: 3
