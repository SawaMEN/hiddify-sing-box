name: Populate native VetrOFFProxy checksum

on:
  push:
    branches: [maintenance/upstream-v5-fixes-20261101]
    paths:
      - '.github/workflows/fix-vetroff-sums-temporary.yml'

permissions:
  contents: write

jobs:
  checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: maintenance/upstream-v5-fixes-20261101
          submodules: recursive
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -mod=mod -count=1 ./protocol/vetroff ./option ./include
      - name: Commit resolved go.sum
        run: |
          if ! git diff --quiet -- go.sum; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.sum
            git commit -m "build: add native VetrOFFProxy module checksum"
            git push origin HEAD:maintenance/upstream-v5-fixes-20261101
          fi
