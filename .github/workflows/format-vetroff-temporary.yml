name: Format legacy VetrOFFProxy Go sources

on:
  push:
    branches: [maintenance/upstream-v5-fixes-20261101]
    paths:
      - '.github/workflows/format-vetroff-temporary.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: maintenance/upstream-v5-fixes-20261101
      - name: Apply gofmt to existing native VetrOFFProxy sources
        run: gofmt -w protocol/vetroff/outbound.go option/vetroff.go
      - name: Commit formatting changes
        run: |
          if ! git diff --quiet -- protocol/vetroff/outbound.go option/vetroff.go; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add protocol/vetroff/outbound.go option/vetroff.go
            git commit -m "style: gofmt native VetrOFFProxy integration"
            git push origin HEAD:maintenance/upstream-v5-fixes-20261101
          fi
