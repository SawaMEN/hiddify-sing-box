name: Upstream compatibility
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Set production tags
        run: |
          echo "BUILD_TAGS=$(sed -n 's/^TAGS ?= //p' Makefile)" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"
      - name: Vet production build
        run: go vet -mod=mod -tags "$BUILD_TAGS" ./...
      - name: Race regressions
        run: go test -mod=mod -race -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" ./common/monitoring ./common/dnspool ./common/tls ./common/urltest ./dns ./route/... ./hiddify/finalmask ./protocol/hiddify/dnstt ./protocol/hiddify/masterdns ./service/smart_dns_pool ./transport/v2rayxdrive ./option -timeout 15m
      - name: Full production test suite
        run: go test -mod=mod -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" -exec sudo ./... -timeout 15m
      - name: Generate schema and module metadata
        if: always()
        run: |
          go run -mod=mod -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" ./cmd/sing-box schema -o docs/schema.json
          mkdir -p /tmp/sync-generated/test
          cp go.mod go.sum /tmp/sync-generated/
          cp test/go.mod test/go.sum /tmp/sync-generated/test/
          cp docs/schema.json /tmp/sync-generated/schema.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sync-generated
          path: /tmp/sync-generated
          retention-days: 3
