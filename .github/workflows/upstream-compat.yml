name: Upstream compatibility
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: upstream-compat-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Set production tags
        run: |
          echo "BUILD_TAGS=$(sed -n 's/^TAGS ?= //p' Makefile)" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"
      - name: Vet production build
        run: go vet -mod=mod -tags "$BUILD_TAGS" ./...
      - name: Race regressions
        run: go test -mod=mod -race -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" ./common/interrupt ./transport/device ./protocol/awg ./common/monitoring ./common/dnspool ./common/tls ./common/urltest ./dns ./route/... ./hiddify/finalmask ./hiddify/ipinfo ./schema ./protocol/hiddify/dnstt ./protocol/hiddify/masterdns ./protocol/hiddify/soar ./protocol/warp ./protocol/masque ./transport/masque ./common/cloudflare ./protocol/group/balancer ./service/smart_dns_pool ./transport/v2rayxdrive ./transport/v2rayxhttp ./option -timeout 15m
      - name: Full production test suite
        run: go test -mod=mod -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" -exec sudo ./... -timeout 15m
      - name: Fetch Xray interoperability binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/xray-latest /tmp/xray-26.3
          release_api="https://api.github.com/repos/XTLS/Xray-core/releases"
          api_headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          latest=$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 "${api_headers[@]}" "$release_api/latest" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')

          download_xray() {
            local tag="$1" output="$2" release_json asset_url direct_url
            release_json=$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 "${api_headers[@]}" "$release_api/tags/$tag")
            asset_url=$(python3 -c 'import json,sys; release=json.load(sys.stdin); print(next(asset["url"] for asset in release["assets"] if asset["name"] == "Xray-linux-64.zip"))' <<< "$release_json")
            direct_url="https://github.com/XTLS/Xray-core/releases/download/$tag/Xray-linux-64.zip"
            if ! curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 "$direct_url" -o "$output" || ! unzip -tq "$output" >/dev/null 2>&1; then
              echo "Direct Xray release download unavailable or invalid for $tag; retrying through GitHub release asset API"
              rm -f "$output"
              curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 "${api_headers[@]}" -H "Accept: application/octet-stream" "$asset_url" -o "$output"
              unzip -tq "$output" >/dev/null
            fi
          }

          download_xray "$latest" /tmp/xray-latest.zip
          download_xray v26.3.27 /tmp/xray-26.3.zip
          unzip -q /tmp/xray-latest.zip -d /tmp/xray-latest
          unzip -q /tmp/xray-26.3.zip -d /tmp/xray-26.3
          chmod +x /tmp/xray-latest/xray /tmp/xray-26.3/xray
          test -s /tmp/xray-latest/xray && test -s /tmp/xray-26.3/xray
      - name: Xray interoperability regressions
        env:
          HIDDIFY_XRAY: /tmp/xray-latest/xray:/tmp/xray-26.3/xray
        run: go test -mod=mod -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" -run TestH_Xray . -timeout 15m
      - name: Generate schema and module metadata
        if: always()
        run: |
          mkdir -p /tmp/sync-generated/test
          cp go.mod go.sum /tmp/sync-generated/
          cp test/go.mod test/go.sum /tmp/sync-generated/test/
          go run -mod=mod -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" ./cmd/sing-box schema -o docs/schema.json
          cp docs/schema.json /tmp/sync-generated/schema.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sync-generated
          path: /tmp/sync-generated
          retention-days: 3
