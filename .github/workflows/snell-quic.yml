name: Snell Protocol Tests
on:
  push:
    paths:
      - 'protocol/snell/**'
      - 'option/snell.go'
      - '.github/workflows/snell-quic.yml'
  pull_request:
    paths:
      - 'protocol/snell/**'
      - 'option/snell.go'
      - '.github/workflows/snell-quic.yml'
jobs:
  snell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run Snell and option tests
        run: go test -race ./protocol/snell ./option -count=1 -timeout 5m
        env:
          SNELL_V6_IDLE_TEST: 130s
