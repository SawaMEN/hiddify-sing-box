name: Finalize VetrOFFProxy Go outbound

on:
  push:
    branches: [feat/vetroffproxy-client]

permissions:
  contents: write

jobs:
  format-and-dependencies:
    if: github.repository == 'SawaMEN/hiddify-sing-box'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vetroffproxy-client
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Format and resolve dependencies
        run: |
          gofmt -w protocol/vetroff/outbound.go option/vetroff.go constant/proxy.go include/registry.go
          go mod tidy
          go test -mod=mod ./protocol/vetroff ./option ./include
      - name: Commit validated module metadata
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add protocol/vetroff/outbound.go option/vetroff.go constant/proxy.go include/registry.go go.mod go.sum
            git commit -m "build: gofmt and tidy VetrOFFProxy dependency"
            git push origin HEAD:feat/vetroffproxy-client
          fi
