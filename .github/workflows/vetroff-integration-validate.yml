name: Validate VetrOFFProxy integration

on:
  push:
    branches: [main, feat/vetroffproxy-client]
    paths:
      - 'protocol/vetroff/**'
      - 'option/vetroff.go'
      - 'constant/proxy.go'
      - 'include/registry.go'
      - 'go.mod'
      - 'go.sum'
      - '.gitmodules'
      - '.github/workflows/vetroff-integration-validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'protocol/vetroff/**'
      - 'option/vetroff.go'
      - 'constant/proxy.go'
      - 'include/registry.go'
      - 'go.mod'
      - 'go.sum'
      - '.gitmodules'
      - '.github/workflows/vetroff-integration-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: VetrOFFProxy unit and integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify vendored fork submodules
        shell: bash
        run: |
          set -euo pipefail
          for module in replace/tailscale replace/psiphon-quic-go replace/psiphon-tls replace/wireguard-go; do
            test -f "$module/go.mod" || { echo "::error::Missing submodule $module"; exit 1; }
          done
      - name: Check changed Go file formatting
        shell: bash
        run: |
          set -euo pipefail
          output="$(gofmt -l protocol/vetroff/outbound.go option/vetroff.go)"
          if [ -n "$output" ]; then echo "$output"; exit 1; fi
      - name: Test VetrOFFProxy and shared integration
        run: go test -mod=mod -count=1 ./protocol/vetroff ./option ./include
