name: Import pinned native sing-vmess source

on:
  push:
    branches:
      - feature/native-vmess-protection-vendor-20261109
    paths:
      - .github/workflows/import-pinned-sing-vmess.yml

permissions:
  contents: write

jobs:
  import-native-vmess:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - name: Pin and import GPLv3 upstream source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e third_party/sing-vmess
          git clone https://github.com/hiddify/sing-vmess.git "$RUNNER_TEMP/sing-vmess"
          git -C "$RUNNER_TEMP/sing-vmess" checkout --detach 93e7499b6da443ad5016f4c4ce469145af311832
          test "$(git -C "$RUNNER_TEMP/sing-vmess" rev-parse HEAD)" = 93e7499b6da443ad5016f4c4ce469145af311832
          mkdir -p third_party
          cp -a "$RUNNER_TEMP/sing-vmess" third_party/sing-vmess
          rm -rf third_party/sing-vmess/.git third_party/sing-vmess/.github
          test -s third_party/sing-vmess/LICENSE
          test "$(head -n 1 third_party/sing-vmess/go.mod)" = "module github.com/sagernet/sing-vmess"
      - name: Apply reviewed Vision protection patch to source, once
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/SawaMEN/3x-ui/600c06179de93a85b4e959f1bbb4813ef9e885b5/deploy/hiddify/sing-vmess-protection.patch \
            -o "$RUNNER_TEMP/sing-vmess-protection.patch"
          test -s "$RUNNER_TEMP/sing-vmess-protection.patch"
          git apply --check --directory=third_party/sing-vmess "$RUNNER_TEMP/sing-vmess-protection.patch"
          git apply --directory=third_party/sing-vmess "$RUNNER_TEMP/sing-vmess-protection.patch"
          gofmt -w third_party/sing-vmess/vless/vision.go third_party/sing-vmess/vless/vision_utls.go \
            third_party/sing-vmess/vless/client.go third_party/sing-vmess/vless/service.go \
            third_party/sing-vmess/vless/xui_vision_options.go
          test -s third_party/sing-vmess/vless/xui_vision_options.go
      - name: Commit reviewable source without further overlay steps
        shell: bash
        run: |
          set -euo pipefail
          cat > third_party/sing-vmess/PROVENANCE.md <<'EOF'
          # Pinned sing-vmess source

          Upstream: https://github.com/hiddify/sing-vmess
          Revision: 93e7499b6da443ad5016f4c4ce469145af311832
          License: GPLv3 or later (see retained LICENSE).
          Native Vision protection port: 3x-ui/deploy/hiddify/sing-vmess-protection.patch
          applied once to the committed source. No release-time overlay.
          Reverse framing is not yet included.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add third_party/sing-vmess
          git diff --cached --check
          git commit -m 'feat(deps): vendor patched Vision sing-vmess GPLv3 source'
          git push origin HEAD:refs/heads/feature/native-vmess-protection-vendor-20261109
