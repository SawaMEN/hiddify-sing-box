name: Native VLESS reverse and Vision source regressions

on:
  push:
    branches:
      - feature/native-vmess-reverse-source-20261109
    paths:
      - .github/workflows/native-vmess-reverse-regressions.yml
      - third_party/sing-vmess/**
      - protocol/vless/**
  pull_request:
    paths:
      - third_party/sing-vmess/**
      - protocol/vless/**

permissions:
  contents: read

jobs:
  race-and-wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Native reverse wire and Vision synchronization
        shell: bash
        run: |
          set -euo pipefail
          go test -race -tags with_utls \
            github.com/sagernet/sing-vmess/vless \
            github.com/sagernet/sing-box/protocol/vless \
            -run '^(TestH_Vision|TestXUIPanelVision|TestXUIPanelUnsupportedVLESS|TestXUIReverse)' \
            -count=1 -timeout=2m
